# Generated by .catalog/scripts/render_catalog.py from the catalogue taxonomy.
name: Suggest a project
description: Suggest an open-source OSINT tool for the catalogue.
title: "Add "
body:
  - type: markdown
    attributes:
      value: >-
        Check the [inclusion criteria](https://github.com/osintshifu/awesome-osint-repos/blob/main/CONTRIBUTING.md#what-belongs-in-the-catalogue)
        before suggesting a project.
  - type: input
    id: repository
    attributes:
      label: Repository URL
      placeholder: https://github.com/owner/repository
    validations:
      required: true
  - type: input
    id: description
    attributes:
      label: What does the tool do?
      description: One sentence in neutral language.
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - "Identity"
        - "Social Media"
        - "Code Repositories"
        - "Infrastructure"
        - "Web"
        - "Dark Web"
        - "Threat Intelligence"
        - "Documents & Records"
        - "Media"
        - "Geolocation"
        - "Cryptocurrency"
        - "Investigation"
    validations:
      required: true
  - type: dropdown
    id: target-input
    attributes:
      label: Target input
      description: The data the tool works with. Leave empty when it has no fixed input.
      multiple: true
      options:
        - "Aircraft ID"
        - "ASN"
        - "Audio"
        - "BSSID / SSID"
        - "CIDR"
        - "Coordinates"
        - "Crypto Address"
        - "CVE ID"
        - "Dataset"
        - "Document"
        - "Domain"
        - "Email"
        - "Event Data"
        - "File"
        - "File Hash"
        - "Image"
        - "IP Address"
        - "Keyword"
        - "Location"
        - "Name"
        - "Onion Service"
        - "Organization Name"
        - "Phone Number"
        - "Repository URL"
        - "Text"
        - "URL"
        - "Username"
        - "Video"
  - type: input
    id: ai-agent
    attributes:
      label: AI agent
      description: For a skill, plugin, or MCP server, the agent it targets.
  - type: dropdown
    id: relationship
    attributes:
      label: Your relationship to the project
      options:
        - "Not affiliated"
        - "Author or maintainer"
        - "Contributor"
    validations:
      required: true
